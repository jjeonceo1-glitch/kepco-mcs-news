name: KEPCO-MCS News Bot

# 실행 주기 설정 (UTC 기준이므로 한국 시간보다 9시간 느림)
# 아래 설정은 매 5분마다 자동으로 코드를 실행합니다.
on:
  schedule:
    - cron: '*/5 * * * *' 
  workflow_dispatch: # 수동으로 언제든 실행 버튼을 누를 수도 있습니다.

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 소스코드 가져오기
        uses: actions/checkout@v4

      - name: 🐍 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 openpyxl

      - name: 🚀 뉴스 모니터링 봇 실행
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python news_bot.py

      - name: 💾 중복 방지 파일 및 엑셀 변경사항 자동 저장 (Git Commit)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 자동 뉴스 수집 결과 업데이트 및 중복 방지 리스트 동기화"
          file_pattern: "*.txt *.xlsx"